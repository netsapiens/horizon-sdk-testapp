name: Deploy to GitHub Pages

# Builds the Module Federation remote and publishes dist/ to GitHub Pages, which
# serves it as a CDN:
#   https://netsapiens.github.io/horizon-sdk-testapp/remoteEntry.js
#
# GitHub Pages sends `Access-Control-Allow-Origin: *`, which is what lets a
# Horizon host load the bundle cross-origin AND lets Subresource Integrity verify
# it — SRI cannot check an opaque response, so without CORS the pin silently does
# nothing.
#
# ⚠️ A STABLE URL, OVERWRITTEN IN PLACE. This replaced a versioned-path scheme
# (dist/v<version>/ published to a `gh-pages` branch with keep_files: true, plus a
# byte-comparison guard). All of that existed to keep previously published
# versions resolving forever, because the platform pins a hash of the exact bytes
# at a URL. Once the URL stopped carrying the version there was nothing left to
# accumulate, so the branch strategy and its guard went with it. This workflow is
# now identical in shape to horizon-sdk-demo's.
#
# The trade being made: overwriting this path DOES break every host still holding
# the old pin until the new version is submitted and promoted. That window is
# accepted deliberately — updates happen in maintenance windows, live sessions do
# not re-fetch their bundles, and an SRI mismatch leaves the extension absent for
# that session rather than breaking anything else. Weighed against an admin
# hand-editing a URL on every release, this is the lower-risk option.
#
# ⚠️ WHAT YOU MUST NOT FORGET: bump `version` in package.json whenever the bytes
# change. It is now the integrity trigger. With a versioned URL, forgetting to
# bump it produced an obvious 404. Here it produces silence — nothing re-verifies,
# the stored hash stops matching what is served, and the app dies on next load
# with no verdict and no finding to explain why. The guard below is the only thing
# standing between a forgotten bump and that outcome.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the deploy job to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; don't cancel a running publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version guard below compares this build against the previous
          # commit's, so it needs one commit of history beyond HEAD.
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      # The full contract checker shipped in @netsapiens/horizon-sdk. Catching a
      # violation here beats a rejected submission.
      #
      # ⚠️ Invoked with `node`, NOT `npx horizon-verify-bundle`. In SDK 0.2.0 the
      # packaged bin silently no-ops and exits 0 — its main-module guard compared
      # basename(argv[1]) against "verify-bundle", which is false once npm links it
      # as "horizon-verify-bundle". A CI step calling it passes unconditionally.
      # Fixed in 0.2.1; switch to npx once this repo is on it.
      - name: Check the bundle contract
        run: npm run verify

      # ⚠️ THE VERSION GUARD — the replacement for the old immutability guard, and
      # the more important of the two.
      #
      # The old guard protected published bytes from being overwritten. Overwriting
      # is now the intended behaviour, so that check is gone. What replaced it
      # guards the thing that actually breaks now: bytes changing while `version`
      # stays put. That combination silently invalidates the platform's stored hash
      # for every host, with nothing in any UI to explain it.
      #
      # Compares against the PREVIOUS COMMIT rather than what is deployed, because
      # a stable URL keeps no history to diff against — the live bytes are simply
      # whatever shipped last.
      - name: Refuse to ship changed bytes under an unchanged version
        run: |
          PREV_VERSION=$(git show HEAD~1:package.json 2>/dev/null | node -p "try{JSON.parse(require('fs').readFileSync(0,'utf8')).version}catch(e){''}" || echo "")
          THIS_VERSION=$(node -p "require('./package.json').version")

          if [ -z "$PREV_VERSION" ]; then
            echo "No previous package.json (first build?) — nothing to compare."
            exit 0
          fi
          if [ "$PREV_VERSION" != "$THIS_VERSION" ]; then
            echo "version bumped: $PREV_VERSION -> $THIS_VERSION"
            exit 0
          fi

          # Same version. That is only acceptable if this push cannot have changed
          # the emitted bundle. Anything under src/ or the build config can.
          if git diff --quiet HEAD~1 HEAD -- src webpack.config.js package.json package-lock.json; then
            echo "version unchanged ($THIS_VERSION), but nothing that affects the bundle changed either."
            exit 0
          fi

          echo "::error::Bundle inputs changed but the version is still $THIS_VERSION. The remote entry URL is stable, so the platform cannot tell these bytes apart from the ones it already hashed — nothing would re-verify, and the stored SRI hash would stop matching what is served. Every host would fail to load this extension on next page load, with no verdict and no finding to explain it. Bump the version in package.json."
          exit 1

      # webpack emits _-prefixed files that Jekyll would strip.
      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
